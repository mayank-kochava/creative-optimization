openapi: 3.0.3
info:
  title: Creative Intelligence Platform API
  description: |
    API for analyzing ad creatives, detecting duplicates, tracking fatigue, and surfacing KPI metrics.
    All inference runs locally via Ollama. No external API calls.
    Generated from: product-spec-v2.md
  version: 1.0.0
  contact:
    name: Kochava Engineering

servers:
  - url: http://localhost:8000
    description: Local development (Docker Compose)

tags:
  - name: Health
    description: Service health and readiness
  - name: Campaigns
    description: Campaign management
  - name: Creatives
    description: Creative upload, analysis, KPIs, duplicates, fatigue

paths:

  /health:
    get:
      tags: [Health]
      summary: Service health check
      description: |
        Returns readiness status for all subsystems.
        API only accepts requests when all subsystems are ready.
      operationId: getHealth
      responses:
        '200':
          description: All systems ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                data:
                  status: ready
                  ollama: reachable
                  database: connected
                  benchmark_corpus: indexed
                  benchmark_corpus_size: 500
                  model_warmed: true
        '503':
          description: One or more subsystems unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                data:
                  status: degraded
                  ollama: unreachable
                  database: connected
                  benchmark_corpus: indexed
                  benchmark_corpus_size: 500
                  model_warmed: false

  /campaigns:
    get:
      tags: [Campaigns]
      summary: List all campaigns
      description: Returns all campaigns with aggregate KPI summary and top creative thumbnail.
      operationId: listCampaigns
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Campaign list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignListResponse'
        '500':
          $ref: '#/components/responses/InternalError'

    post:
      tags: [Campaigns]
      summary: Create a campaign
      operationId: createCampaign
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCampaignRequest'
            example:
              name: "Gaming UA - May 2026"
              platform_tags: ["facebook", "tiktok"]
      responses:
        '201':
          description: Campaign created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /campaigns/{campaign_id}:
    get:
      tags: [Campaigns]
      summary: Get campaign detail
      operationId: getCampaign
      parameters:
        - $ref: '#/components/parameters/CampaignId'
      responses:
        '200':
          description: Campaign detail with aggregate KPIs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignDetailResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /campaigns/{campaign_id}/creatives:
    get:
      tags: [Creatives]
      summary: List creatives in a campaign
      description: Returns creatives sorted by overall_score DESC by default. Includes scores, fatigue status, and KPI summary per creative.
      operationId: listCreatives
      parameters:
        - $ref: '#/components/parameters/CampaignId'
        - name: sort_by
          in: query
          schema:
            type: string
            enum: [overall_score, ctr, cvr, cpi, roas, created_at]
            default: overall_score
        - name: sort_dir
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - name: fatigue_status
          in: query
          schema:
            type: string
            enum: [healthy, fatiguing, insufficient_data]
        - name: format
          in: query
          schema:
            type: string
            enum: [image, video]
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/LimitParam'
      responses:
        '200':
          description: Creative list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreativeListResponse'
        '404':
          $ref: '#/components/responses/NotFound'

    post:
      tags: [Creatives]
      summary: Upload creative(s) to a campaign
      description: |
        Accepts multipart/form-data with one or more creative files.
        Triggers: pHash computation → duplicate check → analysis (async) → annotation → benchmark.
        Returns immediately with creative IDs and duplicate detection result.
        Poll GET /creatives/{id} for analysis completion.

        **Functional Requirements:** US-01, US-11, US-13
      operationId: uploadCreatives
      parameters:
        - $ref: '#/components/parameters/CampaignId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                files:
                  type: array
                  items:
                    type: string
                    format: binary
              required: [files]
      responses:
        '201':
          description: Creative(s) uploaded; analysis triggered asynchronously
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadResponse'
              example:
                data:
                  creatives:
                    - id: 42
                      filename: "banner_v3.jpg"
                      duplicate_detected: false
                      duplicate_type: null
                      matched_creative_ids: []
                      analysis_status: "pending"
                    - id: 43
                      filename: "banner_v3_resized.jpg"
                      duplicate_detected: true
                      duplicate_type: "cross_platform"
                      matched_creative_ids: [42]
                      analysis_status: "pending"
        '413':
          description: File too large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                data: null
                error:
                  code: "FILE_TOO_LARGE"
                  message: "File exceeds 20MB limit for images (500MB for video)"
        '415':
          description: Unsupported format or codec
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                data: null
                error:
                  code: "UNSUPPORTED_MEDIA_TYPE"
                  message: "Unsupported codec. Please re-export as H.264 or H.265 MP4"
        '422':
          description: Business rule violation (video too short, not an ad)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: Ollama model unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                data: null
                error:
                  code: "MODEL_UNAVAILABLE"
                  message: "Analysis model is not available. Check Ollama status at /health"

  /creatives/{creative_id}:
    get:
      tags: [Creatives]
      summary: Get full creative detail
      description: |
        Returns complete analysis result including scores, explanation, annotations,
        benchmark percentile, recommendations, and KPI summary.
        If analysis is still pending, returns creative metadata with analysis_status: "pending".
      operationId: getCreative
      parameters:
        - $ref: '#/components/parameters/CreativeId'
      responses:
        '200':
          description: Creative detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreativeDetailResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /creatives/{creative_id}/fatigue:
    get:
      tags: [Creatives]
      summary: Get creative fatigue trend
      description: Returns 30-day daily CTR time series and fatigue status with WoW change.
      operationId: getCreativeFatigue
      parameters:
        - $ref: '#/components/parameters/CreativeId'
      responses:
        '200':
          description: Fatigue trend data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FatigueTrendResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /creatives/{creative_id}/duplicates:
    get:
      tags: [Creatives]
      summary: Get duplicate matches for a creative
      operationId: getCreativeDuplicates
      parameters:
        - $ref: '#/components/parameters/CreativeId'
      responses:
        '200':
          description: Duplicate matches
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DuplicatesResponse'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  schemas:

    # --- Health ---

    HealthResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            status:
              type: string
              enum: [ready, degraded]
            ollama:
              type: string
              enum: [reachable, unreachable]
            database:
              type: string
              enum: [connected, disconnected]
            benchmark_corpus:
              type: string
              enum: [indexed, not_indexed]
            benchmark_corpus_size:
              type: integer
            model_warmed:
              type: boolean

    # --- Campaigns ---

    CreateCampaignRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        platform_tags:
          type: array
          items:
            type: string
      required: [name]

    Campaign:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        platform_tags:
          type: array
          items:
            type: string
        creative_count:
          type: integer
        avg_overall_score:
          type: number
          nullable: true
        fatiguing_count:
          type: integer
        top_creative_thumbnail_url:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time

    CampaignResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Campaign'
        error:
          type: 'null'

    CampaignListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Campaign'
        pagination:
          $ref: '#/components/schemas/Pagination'
        error:
          type: 'null'

    CampaignDetailResponse:
      type: object
      properties:
        data:
          allOf:
            - $ref: '#/components/schemas/Campaign'
            - type: object
              properties:
                kpi_summary:
                  $ref: '#/components/schemas/KPISummary'
        error:
          type: 'null'

    # --- Creatives ---

    AnalysisScores:
      type: object
      description: 7-dimension analysis scores, each 0–10
      properties:
        hook_strength:
          type: integer
          minimum: 0
          maximum: 10
        cta_clarity:
          type: integer
          minimum: 0
          maximum: 10
        visual_quality:
          type: integer
          minimum: 0
          maximum: 10
        message_clarity:
          type: integer
          minimum: 0
          maximum: 10
        emotional_resonance:
          type: integer
          minimum: 0
          maximum: 10
        social_proof:
          type: integer
          minimum: 0
          maximum: 10
        brand_consistency:
          type: integer
          minimum: 0
          maximum: 10
      required: [hook_strength, cta_clarity, visual_quality, message_clarity, emotional_resonance, social_proof, brand_consistency]

    Annotation:
      type: object
      properties:
        type:
          type: string
          enum: [face, text, cta]
        bbox:
          type: object
          properties:
            x: { type: integer }
            y: { type: integer }
            w: { type: integer }
            h: { type: integer }
          required: [x, y, w, h]
        label:
          type: string
          nullable: true
        confidence:
          type: number
          minimum: 0
          maximum: 1
      required: [type, bbox, confidence]

    KPISummary:
      type: object
      description: Aggregate KPIs (last 7 days)
      properties:
        ctr:
          type: number
          nullable: true
          description: clicks / impressions
        cvr:
          type: number
          nullable: true
          description: installs / clicks
        cpi:
          type: number
          nullable: true
          description: spend / installs (USD)
        roas:
          type: number
          nullable: true
          description: revenue / spend
        total_impressions:
          type: integer
        total_spend:
          type: number

    CreativeSummary:
      type: object
      description: Creative card data for gallery view
      properties:
        id:
          type: integer
        campaign_id:
          type: integer
        filename:
          type: string
        format:
          type: string
          enum: [jpg, png, webp, gif, mp4, mov]
        thumbnail_url:
          type: string
          nullable: true
        overall_score:
          type: integer
          nullable: true
        scores:
          $ref: '#/components/schemas/AnalysisScores'
          nullable: true
        analysis_status:
          type: string
          enum: [pending, complete, degraded]
        fatigue_status:
          type: string
          enum: [healthy, fatiguing, insufficient_data]
        duplicate_count:
          type: integer
        kpi_summary:
          $ref: '#/components/schemas/KPISummary'
        created_at:
          type: string
          format: date-time

    CreativeDetail:
      allOf:
        - $ref: '#/components/schemas/CreativeSummary'
        - type: object
          properties:
            persuasion_strategy:
              type: string
              enum: [fear_appeal, fomo, aspirational, social_proof, rational, unknown]
            dominant_emotion:
              type: string
              enum: [excitement, fear, trust, joy, sadness, neutral, unknown]
            strengths:
              type: array
              items:
                type: string
            weaknesses:
              type: array
              items:
                type: string
            recommendations:
              type: array
              items:
                type: string
              minItems: 3
              maxItems: 3
            explanation:
              type: string
            benchmark_percentile:
              type: integer
              minimum: 1
              maximum: 100
              nullable: true
            benchmark_corpus_size:
              type: integer
              nullable: true
            annotations:
              type: array
              items:
                $ref: '#/components/schemas/Annotation'

    UploadCreativeResult:
      type: object
      properties:
        id:
          type: integer
        filename:
          type: string
        duplicate_detected:
          type: boolean
        duplicate_type:
          type: string
          enum: [self, cross_platform]
          nullable: true
        matched_creative_ids:
          type: array
          items:
            type: integer
        analysis_status:
          type: string
          enum: [pending, complete, degraded]

    UploadResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            creatives:
              type: array
              items:
                $ref: '#/components/schemas/UploadCreativeResult'
        error:
          type: 'null'

    CreativeListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/CreativeSummary'
        pagination:
          $ref: '#/components/schemas/Pagination'
        error:
          type: 'null'

    CreativeDetailResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/CreativeDetail'
        error:
          type: 'null'

    FatigueTrendResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            creative_id:
              type: integer
            fatigue_status:
              type: string
              enum: [healthy, fatiguing, insufficient_data]
            wow_decline_pct:
              type: number
              nullable: true
              description: Week-over-week CTR change as decimal (e.g. -0.24 = -24%)
            trend:
              type: array
              description: Daily CTR values, oldest first, up to 30 days
              items:
                type: object
                properties:
                  date:
                    type: string
                    format: date
                  ctr:
                    type: number
                    nullable: true
        error:
          type: 'null'

    DuplicatesResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            creative_id:
              type: integer
            duplicates:
              type: array
              items:
                type: object
                properties:
                  matched_creative_id:
                    type: integer
                  hamming_distance:
                    type: integer
                  duplicate_type:
                    type: string
                    enum: [self, cross_platform]
                  matched_campaign_id:
                    type: integer
                  matched_filename:
                    type: string
                  detected_at:
                    type: string
                    format: date-time
        error:
          type: 'null'

    # --- Common ---

    Pagination:
      type: object
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        pages:
          type: integer

    Error:
      type: object
      properties:
        code:
          type: string
          enum:
            - VALIDATION_ERROR
            - NOT_FOUND
            - FILE_TOO_LARGE
            - UNSUPPORTED_MEDIA_TYPE
            - MODEL_UNAVAILABLE
            - DUPLICATE_DETECTED
            - INTERNAL_ERROR
        message:
          type: string
        details:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
      required: [code, message]

    ErrorEnvelope:
      type: object
      properties:
        data:
          type: 'null'
        error:
          $ref: '#/components/schemas/Error'

  parameters:
    CampaignId:
      name: campaign_id
      in: path
      required: true
      schema:
        type: integer

    CreativeId:
      name: creative_id
      in: path
      required: true
      schema:
        type: integer

    PageParam:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1

    LimitParam:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
